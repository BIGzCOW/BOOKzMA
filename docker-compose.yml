services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookzma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD رو توی .env بذار}
      POSTGRES_DB: bookzma
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookzma -d bookzma"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bookzma:${POSTGRES_PASSWORD}@db:5432/bookzma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${BOOKZMA_BACKUP_DIR:?BOOKZMA_BACKUP_DIR رو توی .env بذار}:/backups"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
