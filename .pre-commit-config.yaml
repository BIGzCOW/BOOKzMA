repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^\.github/skills/

      - id: ruff-format
        name: ruff format
        entry: ruff format --check .
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^\.github/skills/

      - id: pytest-fast
        name: pytest (fast subset)
        entry: pytest -x -q --ignore=tests/test_book_catalog_db.py --ignore=tests/test_books_db.py --ignore=tests/test_badges_db.py --ignore=tests/test_reminder_cleanup.py --ignore=tests/test_streak_freezes_db.py --ignore=tests/test_readings_db.py --ignore=tests/test_mesbak_db.py --ignore=tests/test_comeback_db.py --ignore=tests/test_buddy_db.py --ignore=tests/test_account_deletion_db.py --ignore=tests/test_broadcast_db.py --ignore=tests/test_admin_db.py --ignore=tests/test_onboarding_db.py --ignore=tests/test_account_api.py --ignore=tests/test_reminder_limit.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: trailing-whitespace
        exclude: ^\.github/skills/
      - id: end-of-file-fixer
        exclude: ^\.github/skills/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^\.github/skills/